version: 2
updates:
  # Build tooling (build-requirements.txt at repo root, e.g. ucc-gen)
  - package-ecosystem: "pip"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
  # App runtime libraries (ucc-app/lib/requirements.txt), vendored for the
  # handlers' Python 3.13.
  - package-ecosystem: "pip"
    target-branch: "main"
    directory: "/ucc-app/lib"
    schedule:
      interval: "daily"
    groups:
      splunk:
        applies-to: version-updates
        patterns:
          - "splunk*"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "splunk-sdk"
        versions: [">=3.0.0"]
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
