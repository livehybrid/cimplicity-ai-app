version: 2
updates:
  # Build tooling (build-requirements.txt at repo root, e.g. ucc-gen)
  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/ucc-app/lib"
    schedule:
      interval: "daily"
    groups:
      splunk:
        applies-to: version-updates
        patterns:
        - "splunk*"
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
