version: 2
updates:
  # Build tooling (build-requirements.txt at repo root, e.g. ucc-gen)
  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
  # App runtime libraries (ucc-app/lib/requirements.txt). Splunk runs the
  # persistent handlers on Python 3.9, so majors that drop py3.9 are ignored
  # on purpose; lift a cap only when the app moves off the py3.9 runtime.
  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/ucc-app/lib"
    schedule:
      interval: "daily"
    groups:
      splunk:
        applies-to: version-updates
        patterns:
          - "splunk*"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "splunk-sdk"
        versions: [">=3.0.0"]
      - dependency-name: "requests"
        versions: [">=2.33.0"]
      # scikit-learn >=1.7 and scipy >=1.14 need py3.10+.
      - dependency-name: "scikit-learn"
        versions: [">=1.7.0"]
      - dependency-name: "scipy"
        versions: [">=1.14.0"]
      # nltk >=3.9.3 needs py3.10+ (3.9.3 and 3.9.4 both declare it, not just 3.10).
      - dependency-name: "nltk"
        versions: [">=3.9.3"]
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
