name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

jobs:
  package:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install UCC Framework
        # Version lives in build-requirements.txt so Dependabot bumps it (it
        # never touches run: lines). ucc-gen 6.x has an unguarded os.remove()
        # in its lib-purge (numpy's RECORD lists bin/f2py scripts pip never
        # creates under --target; transitive numpy via scrubadub -> the whole
        # build dies with FileNotFoundError; confirmed through 6.5.3, and the
        # reason this repo sat pinned on 5.69.1 until 2026-07-30) —
        # scripts/patch_ucc_purge.py guards it post-install. The script exits
        # loudly if upstream changes, so a future bump re-evaluates the patch.
        # Upstream: https://github.com/splunk/addonfactory-ucc-generator/issues/2081
        run: |
          pip install -r build-requirements.txt
          python scripts/patch_ucc_purge.py

      - name: Determine Version
        id: version
        shell: bash
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Branch builds: derive from the latest v* tag so artefacts never
            # regress below the last release (match v* skips the stray 1.0.0 tag).
            # v1.0.4-3-gabc1234 -> 1.0.4-3-gabc1234; no tag -> 0.0.0-g<hash>
            # checkout@v5 is shallow by default; describe needs tags + ancestry
            git fetch --unshallow --tags 2>/dev/null || git fetch --tags 2>/dev/null || true
            DESCRIBE=$(git describe --tags --match "v*" --always 2>/dev/null || echo "")
            if [[ "$DESCRIBE" == v* ]]; then
              TAG_VERSION="${DESCRIBE#v}"
            else
              TAG_VERSION="0.0.0-g${SHORT_COMMIT_HASH}"
            fi
          fi
          VERSION_WITH_HASH="${TAG_VERSION}+${SHORT_COMMIT_HASH}"
          echo "VERSION_WITH_HASH=${VERSION_WITH_HASH}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: yarn install

      - name: Run Python tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -q

      - name: Generate UCC components
        run: |
          # Generate UCC framework components
          ucc-gen build --source ucc-app -o build/

          # ucc-gen swallows build exceptions and exits 0, so a crash mid-build
          # leaves a partial tree (no default/); fail fast rather than package it
          if [ ! -f "build/cim-plicity/default/app.conf" ]; then
            echo "Error: ucc-gen build incomplete (default/app.conf missing)"
            exit 1
          fi

          # Copy generated files to React app structure
          mkdir -p packages/cim-plicity/src/main/resources/splunk/
          cp -R build/cim-plicity/* packages/cim-plicity/src/main/resources/splunk/

      - name: Build Splunk app
        run: yarn run build

      - name: Update app version
        working-directory: packages/cim-plicity/stage
        run: |
          # Update app.conf with the calculated version (both [id] and [launcher] stanzas)
          if [ -f "default/app.conf" ]; then
            sed -i "s/version = .*/version = ${{ steps.version.outputs.TAG_VERSION }}/g" default/app.conf
          fi
          
          # Update app.manifest version if it exists
          if [ -f "app.manifest" ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.TAG_VERSION }}\"/g" app.manifest
          fi
          
          # Update package id to match directory name without version suffix
          if [ -f "default/app.conf" ]; then
            sed -i "s/id = .*/id = cim-plicity/g" default/app.conf
          fi
          
          # MCP tools: every shipped custom conf needs a [triggers] reload entry
          # (AppInspect check_reload_trigger_for_all_custom_confs). For tools.conf we
          # use http_post so Splunk fires the app's autoregister endpoint on every
          # app-state change: on Splunk Enterprise the handler upserts the MCP tools
          # into the Splunk MCP Server's KV; on Splunk Cloud it no-ops (the native
          # synced-apps registrar registers from tools.conf itself). http_post (not
          # access_endpoints, which would call an unimplemented _reload(); not plain
          # simple, which never registers) is the pattern proven on Splunk Enterprise
          # by ucc-app-builder. The URL omits /services, matching Splunk's own
          # [triggers] convention. ucc-gen emits its own [triggers] stanza (e.g.
          # reload.cim-plicity_settings), so ensure EACH entry exists rather than
          # skipping when [triggers] is merely present.
          if [ -f "default/app.conf" ] && [ -f "default/tools.conf" ]; then
            RELOAD_TOOLS='reload.tools = http_post /cim-plicity/autoregister'
            if ! grep -q "\[triggers\]" default/app.conf; then
              echo "" >> default/app.conf
              echo "[triggers]" >> default/app.conf
              echo "$RELOAD_TOOLS" >> default/app.conf
            elif ! grep -q "^reload\.tools" default/app.conf; then
              sed -i "/^\[triggers\]/a $RELOAD_TOOLS" default/app.conf
            fi
            if ! grep -q "^reload\.cim-plicity_settings" default/app.conf; then
              sed -i '/^\[triggers\]/a reload.cim-plicity_settings = simple' default/app.conf
            fi
          fi


      - name: Generate Package tarball
        shell: bash
        run: |
          mkdir -p dist
          if [ -d "packages/cim-plicity/stage" ]; then
            # Create a properly named directory structure for the tarball
            mkdir -p temp-package/cim-plicity
            cp -r packages/cim-plicity/stage/* temp-package/cim-plicity/
            # Some fixes to the package due to appinspect
            rm -rf temp-package/cim-plicity/lib/sklearn/metrics/_pairwise_distances_reduction/meson.build || true
            # Remove all .pyc files and __pycache__ directories recursively
            find temp-package/cim-plicity -name "*.pyc" -type f -delete || true
            find temp-package/cim-plicity -name "__pycache__" -type d -exec rm -rf {} + || true
            # Strip hidden files/dirs (AppInspect rejects them, e.g. numpy's
            # .f2py_f2cmap, .pytest_cache, .DS_Store); no shipped hidden file is needed
            find temp-package/cim-plicity -name ".*" -not -name "." -exec rm -rf {} + || true
            # bin/ must ship no compiled binaries or test files
            find temp-package/cim-plicity/bin -name "*.so" -type f -delete || true
            find temp-package/cim-plicity/bin -name "test_*.py" -type f -delete || true
            # Normalise permissions before packaging (AppInspect: 755 dirs, 644 files)
            find temp-package/cim-plicity -type d -exec chmod 755 {} + || true
            find temp-package/cim-plicity -type f -exec chmod 644 {} + || true
            mkdir -p dist
            # Create tarball with proper directory structure (avoids ./ prefixes and naming issues)
            cd temp-package
            ucc-gen package --path cim-plicity/ -o ../dist/
            cd ..

            # Cleanup
            rm -rf temp-package
          else
            echo "Error: stage directory not found after build"
            exit 1
          fi

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*

      # - name: Upload Stage Directory for Inspection
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: stage-contents
      #     path: packages/cim-plicity/stage/

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - quality-appinspect-api
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
