[ai_configuration]
api_endpoint = https://openrouter.ai/api/v1/chat/completions
model = google/gemini-2.0-flash-001
# Default PII detectors
pii_detectors = CreditCardDetector|EmailDetector|UrlDetector|DateOfBirthDetector|IpAddressDetector|en_US.SocialSecurityNumberDetector|PhoneDetector|DriversLicenceDetector|PostalCodeDetector|en_GB.NationalInsuranceNumberDetector|en_GB.TaxReferenceNumberDetector|VehicleLicencePlateDetector

[logging]
log_level = INFO

# Prompt guidance edited on the Configuration page's Prompts tab. The stanza MUST
# exist here: ucc-gen generates the conf SPEC for a tab but not the stanza, and
# its settings REST handler 404s on a stanza it cannot find, so every save from
# the UI would fail with "Could not find object id=prompts". Empty means "fall
# through to cim-plicity_prompts.conf, then to the shipped prompt".
[prompts]
ai_detection_guidance =
cim_mapping_guidance =
