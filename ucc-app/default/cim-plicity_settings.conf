[ai_configuration]
api_endpoint = https://openrouter.ai/api/v1/chat/completions
model = google/gemini-2.0-flash-001
# Default PII detectors
pii_detectors = CreditCardDetector|EmailDetector|UrlDetector|DateOfBirthDetector|IpAddressDetector|en_US.SocialSecurityNumberDetector|PhoneDetector|DriversLicenceDetector|PostalCodeDetector|en_GB.NationalInsuranceNumberDetector|en_GB.TaxReferenceNumberDetector|VehicleLicencePlateDetector

[logging]
log_level = INFO

# Prompt guidance edited on the Configuration page's Prompts tab. The stanza MUST
# exist here: ucc-gen generates the conf SPEC for a tab but not the stanza, and
# its settings REST handler 404s on a stanza it cannot find, so every save from
# the UI would fail with "Could not find object id=prompts". Empty means "fall
# through to cim-plicity_prompts.conf, then to the shipped prompt".

# Prompt guidance, edited on the Configuration page's Prompts tab.
#
# This stanza MUST exist: ucc-gen generates a tab's conf spec but not its
# stanza, and the UCC settings REST handler 404s on a stanza it cannot find, so
# every save from the UI would fail with "Could not find object id=prompts".
#
# The values below are the shipped prompts, generated from
# lib/prompts.DEFAULT_GUIDANCE by scripts/gen_prompt_defaults.py. Do not edit
# them here: this file is replaced on upgrade. Edit on the Prompts tab, which
# writes to local/, or clear a box to go back to the shipped prompt.
#
# Only the GUIDANCE is here. The JSON output contract is appended by the app and
# is deliberately not configurable, because every parser downstream depends on
# that exact shape.

[prompts]
ai_detection_guidance = You are a Splunk expert tasked with analyzing a log sample to suggest field extractions. \
    The log sample is: \
    {sample_data} \
    {description_block} \
    Your instructions are: \
    1.  Suggest an appropriate Splunk sourcetype for this data (e.g. 'json', 'syslog', \
    'custom_log') or something appropriate to what you think the data is. \
    2.  Identify key fields to be extracted from the log sample. \
    3.  For each field, provide a robust PCRE-based regex pattern usable in props.conf. The \
    regex must use named capture groups, in Splunk syntax (?<field_name>...) and NOT \
    Python syntax (?P<field_name>...), must match against the entire log line, and must \
    capture its field only once. \
    4.  In addition, provide a single regex pattern that extracts all the fields in one go. \
    5.  Analyse the log data for timestamp patterns and provide TIME_FORMAT (a Python \
    datetime format string), TIME_PREFIX (any prefix appearing before the timestamp, or \
    an empty string) and MAX_TIMESTAMP_LOOKAHEAD (characters to look ahead, default 25, \
    raised when the timestamp sits late in the line). \
    
cim_mapping_guidance = You are a Splunk CIM expert. Your task is to map a list of extracted fields from a log \
    file to the standard fields of a specified Splunk Common Information Model (CIM). \
     \
    CIM Data Model: {cim_model} \
     \
    Available CIM fields for this model: \
    {available_cim_fields} \
     \
    Extracted fields from the log data: \
    {extracted_fields} \
     \
    Your instructions are: \
    1.  Analyse the extracted fields. Pay attention to the field names and their sample values. \
    2.  For each extracted field, find the best matching standard field from the available \
    CIM fields. \
    3.  You may map multiple extracted fields to the same CIM field where appropriate (for \
    example 'ip' and 'client_ip' could both map to 'src_ip'). \
    4.  If an extracted field has no clear and logical mapping, omit it from your response \
    rather than stretching for a CIM field that nearly fits. \
    5.  For each mapping give a confidence between 0.0 and 1.0 reflecting your certainty \
    based on the field names and values. \
    6.  For each mapping give a brief "reasoning" explaining the choice (for example "field \
    name 'user_ip' is a clear synonym for 'src_ip'"). \
    
