[script:ai_detection]
match                 = /ai_detection
script                = ai_detection.py
scripttype            = persist
handler               = ai_detection.AiDetection
python.version        = python3
python.required       = 3.9
# passSession          = true
# * If set to "true", sends the driver information about the user's
#   session. This includes the user's name, an active authtoken,
#   and other details.
# * Only has effect if the 'scripttype' setting is set to "persist".
# * Default: true
passPayload = true
# This is to allow access to the API Credentials without list password capabilities
passSystemAuth = true
passConf = false

[script:pii_detection]
match                 = /pii_detection
script                = pii_detection.py
scripttype            = persist
handler               = pii_detection.PiiDetection
python.version        = python3
python.required       = 3.9
passPayload = true
# This is to allow access to the API Credentials without list password capabilities
passSystemAuth = true

[admin:cim-plicity]
match = /
members = cim-plicity_settings

[admin_external:cim-plicity_settings]
handlertype = python
python.version = python3
python.required = 3.9
handlerfile = cim-plicity_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[script:cim_mapping]
match                 = /cim_mapping
script                = cim_mapping.py
scripttype            = persist
handler               = cim_mapping.CimMappingHandler
python.version        = python3
python.required       = 3.9
passPayload           = true
passSystemAuth        = true

# --- Splunk MCP tools (default/tools.conf) ---------------------------------------
# MCP health tool. App-scoped match per the splunk-react-app skill, so the URL is
# /services/cim-plicity/ping (and /servicesNS/-/cim-plicity/cim-plicity/ping).
# Served by autoregister.py, which dispatches on the matched path's trailing segment.
[script:cim_plicity_ping]
match                 = /cim-plicity/ping
script                = autoregister.py
scripttype            = persist
handler               = autoregister.AutoRegisterHandler
python.version        = python3
python.required       = 3.9
passPayload           = true
passSystemAuth        = true

# Self-registration endpoint, fired by app.conf [triggers] on tools.conf (re)load
# (reload.tools = http_post /cim-plicity/autoregister, added in CI's stage patch).
# On Splunk Enterprise it upserts this app's MCP tools into the Splunk MCP Server's
# KV; on Splunk Cloud it no-ops (the native synced-apps registrar handles it).
# Pure stdlib + splunk.rest, so it runs on Splunk's default persistent python.
[script:cim_plicity_autoregister]
match                 = /cim-plicity/autoregister
script                = autoregister.py
scripttype            = persist
handler               = autoregister.AutoRegisterHandler
python.version        = python3
python.required       = 3.9
passPayload           = true
passSystemAuth        = true
