[expose:cim-plicity_settings]
pattern = cim-plicity_settings
methods = POST, GET

[expose:cim-plicity_settings_specified]
pattern = cim-plicity_settings/*
methods = POST, GET, DELETE

# Custom endpoints

[expose:ai_detection]
pattern = ai_detection
methods = POST

[expose:pii_detection]
pattern = pii_detection
methods = POST

# Was missing: cim_mapping exists in restmap.conf but was never exposed to the
# Splunk Web splunkd proxy (/<locale>/splunkd/__raw/...), so browser-side calls
# 404 even though splunkd (8089) serves it. MCP calls hit 8089 directly and do
# not need web.conf, but the UI/proxy path must match restmap.
[expose:cim_mapping]
pattern = cim_mapping
methods = POST

# MCP self-registration + health (bin/autoregister.py) and the Configuration
# page's model catalogue (bin/ai_model_choices.py). The wildcard covers
# /cim-plicity/ping (GET health tool), /cim-plicity/autoregister (one-shot POST)
# and /cim-plicity/ai_model_choices (GET, UCC singleSelect endpointUrl) via the
# Splunk Web proxy, mirroring ucc-app-builder's ucc_app_builder/* expose.
[expose:cim_plicity_tools]
pattern = cim-plicity/*
methods = GET, POST
