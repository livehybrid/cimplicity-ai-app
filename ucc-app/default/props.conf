# CIM-plicity's own log, $SPLUNK_HOME/var/log/splunk/cim-plicity.log, written by
# lib/cim_plicity_logging.py. Splunk's default [monitor://$SPLUNK_HOME/var/log/splunk]
# input already indexes it into _internal, so the app ships no inputs.conf (a second
# monitor would only duplicate it). This names the sourcetype and parses the
# timestamped lines; without it the file was learned as "cim-plicity-too_small".
[source::.../var/log/splunk/cim-plicity.log(.\d+)?]
sourcetype = cim-plicity:log

[cim-plicity:log]
# One event per log line; a traceback (exc_info) stays with the line it belongs to.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\s
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
