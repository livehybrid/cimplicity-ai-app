# Splunk MCP tool registration for CIMPlicity AI. Each [restmap:<tool>] stanza maps an
# MCP tool to a REST endpoint_name = the matching [script:<name>] stanza in restmap.conf.
# NOTE: the HTTP URL is NOT /services/<endpoint_name> — it is whatever `match =` declares
# on that [script:] stanza (the real path is documented in each description below).
# Splunk Cloud registers these natively from this file on install (synced-apps registrar);
# on Splunk Enterprise bin/autoregister.py upserts the same tools into the Splunk MCP
# Server's KV collections, fired by app.conf [triggers] reload.tools = http_post
# /cim-plicity/autoregister. Keep this file in lockstep with the TOOLS table in
# bin/autoregister.py.
# Typical agent flow: cim_plicity_ping -> ai_detection (suggest field extractions from a
# raw sample) -> pii_detection (scan the sample for PII) -> cim_mapping (map the extracted
# fields onto a Splunk CIM data model).

[restmap:cim_plicity_ping]
description = Health check for CIMPlicity AI. Returns { ok, app, tools }. Call first to verify connectivity before other tools. Real URL (restmap match = /cim-plicity/ping): GET https://<splunkd>:8089/services/cim-plicity/ping (also /servicesNS/-/cim-plicity/cim-plicity/ping).
endpoint_name = cim_plicity_ping
method = get
tags = cim_plicity, health, ping

[restmap:ai_detection]
description = Suggest Splunk field extractions for a raw log sample: props.conf-ready PCRE regexes with named capture groups, a suggested sourcetype and timestamp settings. Uses the app-configured AI provider (Configuration page > AI Configuration; OpenRouter) with a deterministic local regex fallback when no API key is set. POST a RAW JSON body (Content-Type: application/json — the handler json-parses the payload, form-encoding fails): { text (required, the raw sample event/lines), description (optional context about the data), selected_fields (optional array of field names — when given, a combined_regex covering exactly those fields is built) }. Returns { sourcetype, fields: [{name, regex}], combined_regex, time_format, time_prefix, max_timestamp_lookahead, source }. Real URL (restmap match = /ai_detection): POST https://<splunkd>:8089/services/ai_detection (also /servicesNS/-/cim-plicity/ai_detection).
endpoint_name = ai_detection
method = post
tags = cim_plicity, field_extraction, props, regex, onboarding

[restmap:pii_detection]
description = Detect PII in a raw log sample using scrubadub detectors (detector set configurable on the Configuration page, pii_detectors) plus optional caller-supplied regex patterns. POST a RAW JSON body (Content-Type: application/json): { text (required, the raw sample to scan), custom_patterns (optional array of {name, regex} — extra patterns matched case-insensitively) }. Returns { pii_results: [{type, text, score, start, end, field, examples, regex_pattern}], suggestion } where suggestion summarises detected PII types and the recommended masking action. Real URL (restmap match = /pii_detection): POST https://<splunkd>:8089/services/pii_detection (also /servicesNS/-/cim-plicity/pii_detection).
endpoint_name = pii_detection
method = post
tags = cim_plicity, pii, privacy, masking, onboarding

[restmap:cim_mapping]
description = Map extracted log fields onto a Splunk Common Information Model (CIM) data model with AI, returning per-field confidence and reasoning. Requires the AI api_key configured (Configuration page); returns {error: "AI service is not configured."} otherwise. POST a RAW JSON body (Content-Type: application/json): { extractedFields (required array — objects like {name, sample}; including sample values improves mapping quality), cimModel (required model key, lowercase with underscores, e.g. authentication, network_traffic, web — models are loaded dynamically from Splunk_SA_CIM when installed, with a built-in fallback for those three) }. Returns a JSON array [{field, cimField, confidence (0.0-1.0), reasoning}] with unmappable fields omitted, or {error}. Real URL (restmap match = /cim_mapping): POST https://<splunkd>:8089/services/cim_mapping (also /servicesNS/-/cim-plicity/cim_mapping).
endpoint_name = cim_mapping
method = post
tags = cim_plicity, cim, data_model, mapping, onboarding
